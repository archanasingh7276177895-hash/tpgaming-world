<div class="dashboard-container">
  <div class="welcome-banner">
    <h2>Welcome Back, {{ username }}! 👋</h2>
    <p *ngIf="userRole === 'admin'">
      🛡️ <strong>Admin Account:</strong> All matches launch in offline Practice Mode against Computer AI.
    </p>
    <p *ngIf="userRole !== 'admin'">
      Select your player mode, entry fee tier, and launch into match matchmaking.
    </p>
  </div>

  <div class="games-grid">
    <!-- Game 1: Classic Ludo -->
    <div class="game-card">
      <div class="game-icon">🎲</div>
      <h3>Classic Ludo</h3>

      <!-- Play Mode Selector (Live vs Bot) -->
      <div class="selector-group" *ngIf="userRole !== 'admin'">
        <label>Opponent Type:</label>
        <div class="toggle-buttons">
          <button class="toggle-btn" [class.active]="matchType['ludo'] === 'live'" (click)="selectMatchType('ludo', 'live')">👥 Live Players</button>
          <button class="toggle-btn" [class.active]="matchType['ludo'] === 'bot'" (click)="selectMatchType('ludo', 'bot')">🤖 vs Computer</button>
        </div>
      </div>

      <div class="selector-group">
        <label>Player Count:</label>
        <div class="toggle-buttons">
          <button class="toggle-btn" [class.active]="gameModes['ludo'] === '2P'" (click)="selectMode('ludo', '2P')">2 Players</button>
          <button class="toggle-btn" [class.active]="gameModes['ludo'] === '4P'" (click)="selectMode('ludo', '4P')">4 Players</button>
        </div>
      </div>

      <div class="selector-group" *ngIf="userRole !== 'admin' && matchType['ludo'] !== 'bot'">
        <label>Select Entry Fee:</label>
        <div class="tier-buttons">
          <button *ngFor="let fee of boardEntryFees" class="tier-btn" [class.active]="selectedFees['ludo'] === fee" (click)="selectFee('ludo', fee)">
            ₹{{ fee }}
          </button>
        </div>
      </div>

      <button class="btn-play" (click)="startGame('ludo')">
        {{ (userRole === 'admin' || matchType['ludo'] === 'bot') ? 'Play vs Computer (Free)' : ('Play ' + gameModes['ludo'] + ' Match (₹' + selectedFees['ludo'] + ')') }}
      </button>
    </div>
