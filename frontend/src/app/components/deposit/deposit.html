<div class="deposit-container">
  <h2>Deposit Wallet Funds</h2>

  <!-- QR & UPI Details Section -->
  <div class="qr-card">
    <img [src]="qrCodeUrl" alt="UPI QR Code" class="qr-img" />
    <div class="upi-info">
      <p>Account Holder: <strong>{{ accountHolder }}</strong></p>
      <p>Scan QR using GPay, PhonePe, Paytm, or Slice</p>
      <div class="upi-box">
        <span>{{ upiId }}</span>
        <button (click)="copyUpi()" class="btn-copy">Copy</button>
      </div>
    </div>
  </div>

  <!-- Deposit Form -->
  <div class="form-card">
    <label>Select or Enter Amount (₹)</label>
    <div class="quick-buttons">
      <button *ngFor="let amt of quickAmounts" (click)="selectAmount(amt)" [class.active]="amount === amt">
        ₹{{ amt }}
      </button>
    </div>
    <input type="number" [(ngModel)]="amount" placeholder="Enter Amount" class="input-field" min="10" />

    <label>12-Digit UTR / Transaction Reference No.</label>
    <input type="text" [(ngModel)]="utrNumber" placeholder="e.g. 423189056214" class="input-field" />

    <label>Payment Screenshot (Optional)</label>
    <input type="file" (change)="onFileSelected($event)" accept="image/*" class="input-field file-input" />

    <div *ngIf="message" [class.error-msg]="isError" [class.success-msg]="!isError">
      {{ message }}
    </div>

    <button (click)="submitDeposit()" [disabled]="loading" class="btn-submit">
      {{ loading ? 'Submitting...' : 'Submit Deposit Request' }}
    </button>
  </div>

  <!-- Recent Deposit Requests -->
  <div class="history-section" *ngIf="history.length > 0">
    <h3>Recent Deposit Requests</h3>
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Amount</th>
          <th>UTR No.</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of history">
          <td>{{ item.createdAt | date:'short' }}</td>
          <td>₹{{ item.amount }}</td>
          <td>{{ item.utrNumber }}</td>
          <td>
            <span class="status-badge" [class]="item.status">
              {{ item.status | uppercase }}
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
