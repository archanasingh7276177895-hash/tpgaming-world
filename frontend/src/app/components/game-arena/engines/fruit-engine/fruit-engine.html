<div class="fruit-arena">
  <!-- HUD Bar -->
  <div class="hud-bar">
    <div class="score-card player-me">
      <span class="user-label">YOU ({{ currentUser?.username || 'Player' }})</span>
      <span class="score-val">{{ myScore }}</span>
    </div>

    <div class="timer-center" [class.urgent]="gameTimeRemaining <= 10">
      <span class="timer-tag">TIME LEFT</span>
      <span class="timer-digits">{{ gameTimeRemaining }}s</span>
    </div>

    <div class="score-card player-opp">
      <span class="user-label">{{ opponentName | uppercase }}</span>
      <span class="score-val">{{ opponentScore }}</span>
    </div>
  </div>

  <!-- Stage Canvas -->
  <div 
    class="stage-canvas" 
    #canvasStage
    (pointerdown)="handlePointerDown($event)"
    (pointermove)="handlePointerMove($event)"
    (touchmove)="handleTouchMove($event)"
    (touchstart)="handleTouchStart($event)">
    <div class="danger-warning">⚠️ SWIPE TO SLICE FRUITS — AVOID BOMBS 💣</div>

    <div 
      *ngFor="let item of items"
      class="floating-item"
      [class.sliced]="item.sliced"
      [style.left.px]="item.x"
      [style.top.px]="item.y"
      [style.width.px]="item.size"
      [style.height.px]="item.size"
      [style.fontSize.px]="item.size * 0.75"
      (mouseenter)="onItemHover(item)">
      {{ item.emoji }}
      <span class="point-badge" *ngIf="item.sliced && item.type === 'fruit'">
        +{{ item.points }}
      </span>
    </div>
  </div>
</div>
